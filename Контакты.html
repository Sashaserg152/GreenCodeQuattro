<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раздел контакты</title>
    <link rel="stylesheet" href="Визуал.css">
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="header-container">
            <div class="logo">GreenCodeQuattro</div>
            <nav id="main-nav">
                <button onclick="window.location.href='Главная.html'">Главная</button>
                <button onclick="window.location.href='Языки.html'">Язык программирования</button>
                <button onclick="window.location.href='Help.html'">Помощь</button>
                <button onclick="window.location.href='Контакты.html'">Контакты</button>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        <!-- Страница: Контакты -->
        <section>
            <h1 id="page-title-something" style="text-align: center;">Контакты</h1>
            <div id="page-content-something">
                <p>Данный сервис был разработан в качестве дипломной работы Осининой Александры Витальевны.<br><br>
                    При нахождении ошибок, опечаток или несоответствий просьба сообщить на почту: <b>alexsergienko.forwork@gmail.com</b></p>
            </div>
        </section>
    </main>

    <!-- Подвал -->
    <footer>
        &copy; 2026 Green Code Quattro. Осинина А.В., Зенько С.И.
    </footer>

    <script>
        function changePage(section) {
            document.querySelectorAll('.page-section').forEach(page => {
                page.classList.remove('active');
            });
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('active');
            });

            const targetPage = document.getElementById(`page-${section}`);
            if (targetPage) {
                targetPage.classList.add('active');
            }

            const activeButton = document.querySelector(`nav button[data-page="${section}"]`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            const titleElement = targetPage?.querySelector('h1');
            const contentElement = targetPage?.querySelector('div[id^="page-content"]');

            if (titleElement && contentElement) {
                titleElement.style.opacity = 0;
                contentElement.style.opacity = 0;

                setTimeout(() => {
                    titleElement.style.transition = 'opacity 0.5s';
                    contentElement.style.transition = 'opacity 0.5s';
                    titleElement.style.opacity = 1;
                    contentElement.style.opacity = 1;
                }, 200);
            }
        }

        window.onload = () => {
            changePage('main');
        };

        function toggleSection(sectionId) {
    const section = document.getElementById(sectionId);
    section.classList.toggle('active');
    
    // Опционально: меняем стрелочку
    const header = event.target.closest('.toggle-header');
    const text = header.querySelector('strong').nextSibling;
    if (section.classList.contains('active')) {
        text.textContent = ' ▲';
    } else {
        text.textContent = ' ▼';
    }
}
    </script>
</body>
</html>
